# Served behind Cloudflare (TLS) and Traefik (routing). This container speaks plain HTTP on 8080.

map $sent_http_content_type $cache_control {
    default                    "public, max-age=3600";
    ~^text/html                "no-cache";
    ~^font/                    "public, max-age=31536000, immutable";
    application/pdf            "public, max-age=86400";
}

# www.dolanjack.com sends visitors to the bare domain.
server {
    listen 8080;
    server_name www.dolanjack.com;
    return 301 https://dolanjack.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name dolanjack.com _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css text/plain image/svg+xml application/json;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
